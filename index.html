<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Imagine Pro - AI Studio</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;500;700;800&display=swap" rel="stylesheet">
    <style>
        /* --- PRO UI VARIABLES --- */
        :root {
            --bg-body: #050507;
            --bg-panel: #121215;
            --bg-input: #1b1b1f;
            --primary: #6366f1; /* Indigo */
            --accent: #8b5cf6; /* Violet */
            --text-main: #ffffff;
            --text-muted: #94a3b8;
            --border: #27272a;
            --radius: 16px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }

        body {
            background-color: var(--bg-body);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            overflow: hidden;
        }

        /* --- SIDEBAR (History) --- */
        .sidebar {
            width: 300px;
            background: var(--bg-panel);
            border-right: 1px solid var(--border);
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            transition: 0.3s;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 800;
            background: linear-gradient(to right, var(--primary), var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .history-list {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
            padding-right: 5px;
        }

        .history-item {
            background: var(--bg-input);
            border-radius: 10px;
            padding: 10px;
            cursor: pointer;
            border: 1px solid transparent;
            transition: 0.2s;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .history-item:hover { border-color: var(--primary); background: #1f1f25; }
        .history-item img { width: 40px; height: 40px; border-radius: 6px; object-fit: cover; }
        .history-info p { font-size: 0.8rem; font-weight: 500; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; max-width: 150px; }
        .history-info span { font-size: 0.7rem; color: var(--text-muted); }

        /* --- MAIN CONTENT --- */
        .main-content {
            flex: 1;
            padding: 30px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
        }

        .workspace {
            width: 100%;
            max-width: 900px;
        }

        /* --- INPUT SECTION --- */
        .input-container {
            background: var(--bg-panel);
            padding: 20px;
            border-radius: var(--radius);
            border: 1px solid var(--border);
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
            margin-bottom: 30px;
        }

        .prompt-box {
            width: 100%;
            background: var(--bg-input);
            border: 1px solid var(--border);
            color: #fff;
            padding: 15px;
            border-radius: 12px;
            font-size: 1rem;
            resize: none;
            height: 100px;
            outline: none;
            transition: 0.3s;
        }
        .prompt-box:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2); }

        /* --- CONTROLS & STYLES --- */
        .controls-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-top: 20px;
        }

        .control-group label { display: block; font-size: 0.85rem; color: var(--text-muted); margin-bottom: 8px; font-weight: 600; }
        
        .style-grid {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding-bottom: 10px;
        }
        
        .style-card {
            background: var(--bg-input);
            border: 1px solid var(--border);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.85rem;
            cursor: pointer;
            white-space: nowrap;
            transition: 0.2s;
            user-select: none;
        }
        .style-card.active { background: var(--primary); border-color: var(--primary); color: white; }
        .style-card:hover:not(.active) { background: #27272a; }

        input[type="text"] {
            width: 100%;
            background: var(--bg-input);
            border: 1px solid var(--border);
            padding: 10px;
            border-radius: 8px;
            color: #fff;
            outline: none;
        }

        /* --- GENERATE BUTTON --- */
        .btn-generate {
            width: 100%;
            margin-top: 25px;
            padding: 16px;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            box-shadow: 0 5px 20px rgba(99, 102, 241, 0.4);
        }
        .btn-generate:hover { transform: translateY(-2px); box-shadow: 0 10px 30px rgba(99, 102, 241, 0.6); }
        .btn-generate:disabled { opacity: 0.6; cursor: not-allowed; }

        /* --- RESULT AREA --- */
        .result-stage {
            width: 100%;
            min-height: 400px;
            background: #000;
            border-radius: var(--radius);
            border: 1px dashed var(--border);
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
        }

        .result-stage img { max-width: 100%; max-height: 600px; border-radius: 10px; display: none; box-shadow: 0 20px 50px rgba(0,0,0,0.5); }
        
        /* Floating Actions on Image */
        .image-actions {
            position: absolute;
            bottom: 20px;
            display: none;
            gap: 10px;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(10px);
            padding: 10px;
            border-radius: 50px;
        }
        
        .action-btn {
            background: transparent; border: none; color: white; font-size: 1.2rem; cursor: pointer; padding: 0 10px; transition: 0.2s;
        }
        .action-btn:hover { color: var(--primary); transform: scale(1.1); }

        /* --- NOTIFICATION --- */
        .toast {
            position: fixed;
            bottom: 20px; right: 20px;
            background: #1f1f25;
            border-left: 4px solid var(--primary);
            padding: 15px 25px;
            border-radius: 8px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            transform: translateX(200%);
            transition: 0.4s;
            z-index: 1000;
            display: flex; align-items: center; gap: 10px;
        }
        .toast.show { transform: translateX(0); }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: var(--bg-body); }
        ::-webkit-scrollbar-thumb { background: #333; border-radius: 10px; }

        /* Mobile Responsive */
        @media (max-width: 768px) {
            .sidebar { display: none; } /* Hide history on mobile for space */
            .main-content { padding: 15px; }
            .controls-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <!-- SIDEBAR -->
    <div class="sidebar">
        <div class="logo">
            <i class="fa-solid fa-wand-magic-sparkles"></i> Imagine Pro
        </div>
        <div style="border-bottom: 1px solid var(--border); padding-bottom: 10px; margin-bottom: 10px;">
            <p style="color: var(--text-muted); font-size: 0.8rem; font-weight: 700;">HISTORY</p>
        </div>
        <div class="history-list" id="historyList">
            <!-- Items will be added here by JS -->
            <p style="text-align: center; color: #444; font-size: 0.8rem; margin-top: 20px;">No history yet</p>
        </div>
        <button onclick="clearHistory()" style="background: transparent; border: 1px solid #333; color: #666; padding: 8px; border-radius: 6px; cursor: pointer; font-size: 0.8rem;">Clear History</button>
    </div>

    <!-- MAIN APP -->
    <div class="main-content">
        <div class="workspace">
            
            <div class="input-container">
                <textarea id="prompt" class="prompt-box" placeholder="Describe your imagination... (e.g., A futuristic cyberpunk city with neon lights, 8k resolution)"></textarea>

                <div class="controls-grid">
                    <!-- Styles -->
                    <div class="control-group">
                        <label><i class="fa-solid fa-paintbrush"></i> Style Preset</label>
                        <div class="style-grid" id="styleGrid">
                            <div class="style-card active" onclick="setStyle('None', this)">None</div>
                            <div class="style-card" onclick="setStyle('Cinematic', this)">Cinematic</div>
                            <div class="style-card" onclick="setStyle('Anime', this)">Anime</div>
                            <div class="style-card" onclick="setStyle('3D Render', this)">3D Model</div>
                            <div class="style-card" onclick="setStyle('Digital Art', this)">Digital Art</div>
                            <div class="style-card" onclick="setStyle('Oil Painting', this)">Oil Paint</div>
                        </div>
                    </div>

                    <!-- Negative Prompt -->
                    <div class="control-group">
                        <label><i class="fa-solid fa-ban"></i> Negative Prompt (Remove)</label>
                        <input type="text" id="negative" placeholder="blur, ugly, bad quality, deformed...">
                    </div>
                </div>

                <div class="controls-grid" style="margin-top: 15px;">
                     <!-- Aspect Ratio -->
                     <div class="control-group">
                        <label><i class="fa-solid fa-crop"></i> Aspect Ratio</label>
                        <select id="aspect" style="width: 100%; background: var(--bg-input); border: 1px solid var(--border); padding: 10px; color: white; border-radius: 8px;">
                            <option value="1:1">Square (1:1)</option>
                            <option value="16:9">Landscape (16:9)</option>
                            <option value="9:16">Portrait (Mobile)</option>
                        </select>
                    </div>
                     <!-- Model Switch -->
                     <div class="control-group">
                        <label><i class="fa-solid fa-brain"></i> AI Model</label>
                        <select id="model" style="width: 100%; background: var(--bg-input); border: 1px solid var(--border); padding: 10px; color: white; border-radius: 8px;">
                            <option value="flux">Flux Realism (Best)</option>
                            <option value="turbo">SDXL Turbo (Fastest)</option>
                        </select>
                    </div>
                </div>

                <button class="btn-generate" id="genBtn" onclick="generateImage()">
                    <i class="fa-solid fa-rocket"></i> Generate Artwork
                </button>
            </div>

            <!-- OUTPUT -->
            <div class="result-stage" id="resultStage">
                <div id="loader" style="display: none; text-align: center;">
                    <i class="fa-solid fa-circle-notch fa-spin" style="font-size: 2rem; color: var(--primary);"></i>
                    <p style="margin-top: 10px; color: var(--text-muted);">Creating Magic...</p>
                </div>
                <img id="resultImage" src="">
                
                <div class="image-actions" id="imgActions">
                    <button class="action-btn" title="Download" onclick="downloadImage()"><i class="fa-solid fa-download"></i></button>
                    <button class="action-btn" title="Open Fullscreen" onclick="openFullscreen()"><i class="fa-solid fa-expand"></i></button>
                </div>
            </div>

        </div>
    </div>

    <!-- TOAST NOTIFICATION -->
    <div class="toast" id="toast">
        <i class="fa-solid fa-check-circle" style="color: var(--primary);"></i>
        <span id="toastMsg">Action Successful</span>
    </div>

    <script>
        // --- JS LOGIC ---
        
        let currentStyle = "";

        // 1. STYLE SELECTION LOGIC
        function setStyle(style, element) {
            currentStyle = style === "None" ? "" : style;
            
            // UI Update
            document.querySelectorAll('.style-card').forEach(el => el.classList.remove('active'));
            element.classList.add('active');
        }

        // 2. MAIN GENERATION LOGIC
        function generateImage() {
            const promptInput = document.getElementById('prompt');
            const negativeInput = document.getElementById('negative');
            const aspect = document.getElementById('aspect').value;
            const model = document.getElementById('model').value;
            
            const btn = document.getElementById('genBtn');
            const loader = document.getElementById('loader');
            const img = document.getElementById('resultImage');
            const actions = document.getElementById('imgActions');

            let prompt = promptInput.value.trim();

            if (!prompt) {
                showToast("Please write a prompt first!", true);
                return;
            }

            // UI Loading
            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Generating...';
            img.style.display = 'none';
            actions.style.display = 'none';
            loader.style.display = 'block';

            // --- PROMPT ENGINEERING ---
            let finalPrompt = prompt;
            if (currentStyle) finalPrompt += `, ${currentStyle} style`;
            
            // Add enhancements
            finalPrompt += ", high quality, 8k, detailed";
            
            // Negative prompts via URL param (Pollinations supports this mostly via prompt hacking)
            if(negativeInput.value.trim()) {
                finalPrompt += ` --no ${negativeInput.value.trim()}`; 
            }

            // Dimensions
            let w = 1024, h = 1024;
            if(aspect === "16:9") { w = 1280; h = 720; }
            if(aspect === "9:16") { w = 720; h = 1280; }

            const seed = Math.floor(Math.random() * 100000);
            const encodedPrompt = encodeURIComponent(finalPrompt);

            const url = `https://image.pollinations.ai/prompt/${encodedPrompt}?width=${w}&height=${h}&seed=${seed}&model=${model}&nologo=true`;

            // Image Load
            const newImg = new Image();
            newImg.src = url;

            newImg.onload = function() {
                img.src = url;
                img.style.display = 'block';
                loader.style.display = 'none';
                actions.style.display = 'flex';
                btn.disabled = false;
                btn.innerHTML = '<i class="fa-solid fa-rocket"></i> Generate Artwork';
                
                showToast("Image Generated Successfully!");
                saveToHistory(url, prompt);
            };

            newImg.onerror = function() {
                showToast("Generation Failed. Try again.", true);
                loader.style.display = 'none';
                btn.disabled = false;
                btn.innerHTML = '<i class="fa-solid fa-rocket"></i> Generate Artwork';
            };
        }

        // 3. HISTORY SYSTEM (Local Storage)
        function saveToHistory(url, prompt) {
            let history = JSON.parse(localStorage.getItem('imgHistory')) || [];
            
            // Add new item to top
            history.unshift({ url: url, prompt: prompt });
            
            // Keep only last 10
            if(history.length > 10) history.pop();

            localStorage.setItem('imgHistory', JSON.stringify(history));
            loadHistory();
        }

        function loadHistory() {
            const list = document.getElementById('historyList');
            let history = JSON.parse(localStorage.getItem('imgHistory')) || [];
            
            list.innerHTML = ""; // Clear list

            if(history.length === 0) {
                list.innerHTML = '<p style="text-align: center; color: #444; font-size: 0.8rem; margin-top: 20px;">No history yet</p>';
                return;
            }

            history.forEach(item => {
                const div = document.createElement('div');
                div.className = 'history-item';
                div.innerHTML = `
                    <img src="${item.url}" loading="lazy">
                    <div class="history-info">
                        <p>${item.prompt}</p>
                        <span>${new Date().toLocaleTimeString()}</span>
                    </div>
                `;
                // Click to view
                div.onclick = () => {
                    document.getElementById('resultImage').src = item.url;
                    document.getElementById('resultImage').style.display = 'block';
                    document.getElementById('imgActions').style.display = 'flex';
                };
                list.appendChild(div);
            });
        }

        function clearHistory() {
            localStorage.removeItem('imgHistory');
            loadHistory();
            showToast("History Cleared");
        }

        // 4. DOWNLOAD & UTILS
        async function downloadImage() {
            const img = document.getElementById('resultImage');
            try {
                const response = await fetch(img.src);
                const blob = await response.blob();
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `imagine-pro-${Date.now()}.jpg`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                showToast("Download Started");
            } catch(e) {
                console.error(e);
                showToast("Error downloading. Right click to save.", true);
            }
        }

        function openFullscreen() {
            const img = document.getElementById('resultImage');
            if(img.src) window.open(img.src, '_blank');
        }

        function showToast(msg, isError = false) {
            const toast = document.getElementById('toast');
            const msgSpan = document.getElementById('toastMsg');
            
            toast.style.borderLeftColor = isError ? '#ef4444' : '#6366f1';
            msgSpan.innerText = msg;
            toast.classList.add('show');
            
            setTimeout(() => {
                toast.classList.remove('show');
            }, 3000);
        }

        // Load history on startup
        window.onload = loadHistory;

    </script>
</body>
</html>
