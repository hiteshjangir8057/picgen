<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Turbo Gen</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;500;700&display=swap" rel="stylesheet">
    <style>
        /* CSS: Same Dark Theme (User Liked) */
        :root {
            --primary: #00ff88;
            --secondary: #60efff;
            --bg-dark: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.8);
            --text: #f8fafc;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Space Grotesk', sans-serif; }

        body {
            background-color: var(--bg-dark);
            background-image: radial-gradient(at 0% 0%, rgba(96, 239, 255, 0.15) 0px, transparent 50%), radial-gradient(at 100% 100%, rgba(0, 255, 136, 0.15) 0px, transparent 50%);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 40px;
            width: 100%;
            max-width: 480px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            text-align: center;
        }

        h1 {
            font-size: 2rem;
            margin-bottom: 5px;
            background: linear-gradient(to right, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 700;
        }

        p.subtitle { color: #94a3b8; font-size: 0.9rem; margin-bottom: 25px; }

        textarea {
            width: 100%;
            height: 100px;
            background: rgba(15, 23, 42, 0.6);
            border: 2px solid rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            padding: 16px;
            color: #fff;
            font-size: 1rem;
            resize: none;
            outline: none;
            transition: 0.3s;
        }

        textarea:focus { border-color: var(--primary); box-shadow: 0 0 20px rgba(0, 255, 136, 0.1); }

        .controls {
            display: flex;
            gap: 10px;
            margin-top: 15px;
            justify-content: center;
        }

        .btn-main {
            width: 100%;
            margin-top: 20px;
            padding: 14px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, var(--primary), #00cc6a);
            color: #000;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s;
            text-transform: uppercase;
        }

        .btn-main:hover { transform: translateY(-2px); box-shadow: 0 10px 25px rgba(0, 255, 136, 0.25); }
        .btn-main:disabled { background: #475569; cursor: wait; opacity: 0.7; }

        .image-box {
            margin-top: 25px;
            min-height: 280px;
            border-radius: 16px;
            background: rgba(0, 0, 0, 0.3);
            border: 2px dashed rgba(255, 255, 255, 0.1);
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        .image-box img {
            width: 100%;
            height: auto;
            border-radius: 16px;
            display: none;
            animation: fadeUp 0.5s ease;
        }

        .loader {
            display: none;
            width: 40px;
            height: 40px;
            border: 4px solid #fff;
            border-bottom-color: transparent;
            border-radius: 50%;
            animation: rotation 0.8s linear infinite;
        }

        .download-btn {
            display: none;
            margin-top: 15px;
            background: transparent;
            border: 1px solid var(--secondary);
            color: var(--secondary);
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 0.9rem;
            cursor: pointer;
            width: 100%;
        }
        .download-btn:hover { background: var(--secondary); color: #000; }

        @keyframes rotation { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        @keyframes fadeUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

    <div class="container">
        <h1>Turbo AI Art</h1>
        <p class="subtitle">Super Fast Image Generation ⚡</p>

        <textarea id="prompt" placeholder="Type here... (e.g., Cyberpunk cat in neon rain)"></textarea>

        <button class="btn-main" id="genBtn" onclick="generateImage()">⚡ Generate Fast</button>

        <div class="image-box">
            <div class="loader" id="loader"></div>
            <img id="resultImage" src="" alt="AI Art">
        </div>

        <button class="download-btn" id="dlBtn" onclick="downloadImage()">Download Image</button>
    </div>

    <script>
        const genBtn = document.getElementById('genBtn');
        const loader = document.getElementById('loader');
        const resultImg = document.getElementById('resultImage');
        const dlBtn = document.getElementById('dlBtn');

        function generateImage() {
            const prompt = document.getElementById('prompt').value.trim();
            
            if(!prompt) {
                alert("Please enter a prompt!");
                return;
            }

            // UI Changes for Loading
            genBtn.disabled = true;
            genBtn.innerText = "Generating...";
            loader.style.display = "block";
            resultImg.style.display = "none";
            dlBtn.style.display = "none";

            // SPEED FIX:
            // 1. Width/Height = 768 (Good quality but much faster than 1024)
            // 2. Model = Flux (Ye naya model hai, bahut fast hai)
            const seed = Math.floor(Math.random() * 999999);
            const encodedPrompt = encodeURIComponent(prompt);
            
            // URL Structure optimized for Speed
            const imageUrl = `https://image.pollinations.ai/prompt/${encodedPrompt}?width=768&height=768&seed=${seed}&model=flux&nologo=true`;

            const img = new Image();
            img.src = imageUrl;

            img.onload = function() {
                resultImg.src = imageUrl;
                resultImg.style.display = "block";
                loader.style.display = "none";
                genBtn.disabled = false;
                genBtn.innerText = "⚡ Generate Again";
                dlBtn.style.display = "inline-block";
            };

            img.onerror = function() {
                alert("Server busy! Trying backup model...");
                // Fallback to smaller size if Flux fails
                resultImg.src = `https://image.pollinations.ai/prompt/${encodedPrompt}?width=512&height=512&seed=${seed}&nologo=true`;
                resultImg.style.display = "block";
                loader.style.display = "none";
                genBtn.disabled = false;
            };
        }

        async function downloadImage() {
            try {
                const imageUrl = resultImg.src;
                const response = await fetch(imageUrl);
                const blob = await response.blob();
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.style.display = 'none';
                a.href = url;
                a.download = `turbo-art-${Date.now()}.jpg`;
                document.body.appendChild(a);
                a.click();
                window.URL.revokeObjectURL(url);
                document.body.removeChild(a);
            } catch (error) {
                alert("Download failed. Right-click and Save Image.");
            }
        }
    </script>
</body>
</html>
