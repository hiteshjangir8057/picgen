<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Art Generator</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;500;700&display=swap" rel="stylesheet">
    <style>
        /* CSS: GitHub Ready - Dark Neon Theme */
        :root {
            --primary: #00ff88;
            --secondary: #60efff;
            --bg-dark: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
            --text: #f8fafc;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Space Grotesk', sans-serif; }

        body {
            background-color: var(--bg-dark);
            background-image: 
                radial-gradient(at 0% 0%, rgba(96, 239, 255, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(0, 255, 136, 0.15) 0px, transparent 50%);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 40px;
            width: 100%;
            max-width: 500px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            text-align: center;
        }

        h1 {
            font-size: 2rem;
            margin-bottom: 10px;
            background: linear-gradient(to right, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 700;
        }

        p.subtitle {
            color: #94a3b8;
            font-size: 0.9rem;
            margin-bottom: 30px;
        }

        textarea {
            width: 100%;
            height: 120px;
            background: rgba(15, 23, 42, 0.6);
            border: 2px solid rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            padding: 16px;
            color: #fff;
            font-size: 1rem;
            resize: none;
            outline: none;
            transition: 0.3s;
        }

        textarea:focus {
            border-color: var(--primary);
            box-shadow: 0 0 20px rgba(0, 255, 136, 0.1);
        }

        .btn-main {
            width: 100%;
            margin-top: 20px;
            padding: 16px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, var(--primary), #00cc6a);
            color: #000;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .btn-main:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(0, 255, 136, 0.25);
        }

        .btn-main:disabled {
            background: #475569;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .image-box {
            margin-top: 30px;
            min-height: 300px;
            border-radius: 16px;
            background: rgba(0, 0, 0, 0.2);
            border: 2px dashed rgba(255, 255, 255, 0.1);
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        .image-box img {
            width: 100%;
            height: auto;
            border-radius: 16px;
            display: none;
            animation: fadeUp 0.5s ease;
        }

        .loader {
            display: none;
            width: 40px;
            height: 40px;
            border: 4px solid #fff;
            border-bottom-color: transparent;
            border-radius: 50%;
            animation: rotation 1s linear infinite;
        }

        .download-btn {
            display: none;
            margin-top: 15px;
            background: transparent;
            border: 1px solid var(--secondary);
            color: var(--secondary);
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 0.9rem;
            cursor: pointer;
            transition: 0.3s;
        }

        .download-btn:hover {
            background: var(--secondary);
            color: #0f172a;
        }

        @keyframes rotation { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        @keyframes fadeUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

    </style>
</head>
<body>

    <div class="container">
        <h1>AI Imagine</h1>
        <p class="subtitle">Free Unlimited Image Generation</p>

        <textarea id="prompt" placeholder="Imagine something... (e.g., A cute astronaut cat on Mars, digital art, 8k)"></textarea>

        <button class="btn-main" id="genBtn" onclick="generateImage()">Generate Art</button>

        <div class="image-box">
            <div class="loader" id="loader"></div>
            <img id="resultImage" src="" alt="AI Art">
        </div>

        <button class="download-btn" id="dlBtn" onclick="downloadImage()">Download HD Image</button>
    </div>

    <script>
        // GitHub Pages Friendly Logic
        
        const genBtn = document.getElementById('genBtn');
        const loader = document.getElementById('loader');
        const resultImg = document.getElementById('resultImage');
        const dlBtn = document.getElementById('dlBtn');

        function generateImage() {
            const prompt = document.getElementById('prompt').value.trim();
            
            if(!prompt) {
                alert("Please enter a prompt!");
                return;
            }

            // UI Reset
            genBtn.disabled = true;
            genBtn.innerText = "Dreaming...";
            loader.style.display = "block";
            resultImg.style.display = "none";
            dlBtn.style.display = "none";

            // Pollinations AI URL (No API Key Required)
            // Hum random seed use karte hain taki har baar nayi image bane
            const seed = Math.floor(Math.random() * 999999);
            const encodedPrompt = encodeURIComponent(prompt);
            const imageUrl = `https://image.pollinations.ai/prompt/${encodedPrompt}?seed=${seed}&width=1024&height=1024&nologo=true`;

            // Image Preloading Logic
            const img = new Image();
            img.src = imageUrl;

            img.onload = function() {
                // Jab image load ho jaye tabhi show karein
                resultImg.src = imageUrl;
                resultImg.style.display = "block";
                loader.style.display = "none";
                genBtn.disabled = false;
                genBtn.innerText = "Generate Again";
                dlBtn.style.display = "inline-block";
            };

            img.onerror = function() {
                alert("Error loading image. Server busy, please try again.");
                loader.style.display = "none";
                genBtn.disabled = false;
                genBtn.innerText = "Generate Art";
            };
        }

        // Secure Download Logic for GitHub Pages (CORS Bypass)
        async function downloadImage() {
            try {
                const imageUrl = document.getElementById('resultImage').src;
                // Fetch image as blob data
                const response = await fetch(imageUrl);
                const blob = await response.blob();
                
                // Create a temporary link
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.style.display = 'none';
                a.href = url;
                a.download = `ai-generated-${Date.now()}.jpg`;
                
                document.body.appendChild(a);
                a.click();
                
                // Cleanup
                window.URL.revokeObjectURL(url);
                document.body.removeChild(a);
            } catch (error) {
                console.error('Download failed:', error);
                alert("Download failed. Please right-click the image and select 'Save Image As'.");
            }
        }
    </script>
</body>
</html>
