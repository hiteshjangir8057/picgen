<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AETHER | Professional AI Workstation</title>
    <!-- Icons & Fonts -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Inter:wght@300;500;700;900&display=swap" rel="stylesheet">
    
    <style>
        /* --- CORE VARIABLES --- */
        :root {
            --bg-main: #09090b;
            --bg-sidebar: #121215;
            --bg-panel: #18181b;
            --bg-input: #27272a;
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --accent: #ec4899; /* Pink accent */
            --success: #10b981;
            --border: #3f3f46;
            --text-main: #ffffff;
            --text-muted: #a1a1aa;
            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 20px;
            --shadow: 0 10px 30px -10px rgba(0,0,0,0.5);
        }

        /* --- RESET & BASE --- */
        * { margin: 0; padding: 0; box-sizing: border-box; outline: none; }
        body { 
            background: var(--bg-main); color: var(--text-main); 
            font-family: 'Inter', sans-serif; height: 100vh; overflow: hidden; 
            display: flex;
        }
        
        /* Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 10px; }
        ::-webkit-scrollbar-track { background: transparent; }

        /* --- LAYOUT --- */
        .app-container { display: flex; width: 100%; height: 100%; }

        /* --- SIDEBAR --- */
        .sidebar {
            width: 80px;
            background: var(--bg-sidebar);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px 0;
            z-index: 10;
            transition: width 0.3s;
        }
        .sidebar:hover { width: 240px; align-items: flex-start; padding-left: 20px; }
        
        .brand {
            font-family: 'JetBrains Mono', monospace;
            font-weight: 900;
            font-size: 1.5rem;
            color: var(--primary);
            margin-bottom: 40px;
            display: flex;
            align-items: center;
            gap: 15px;
            white-space: nowrap;
        }
        .brand span { display: none; color: white; }
        .sidebar:hover .brand span { display: inline; }

        .nav-item {
            width: 100%;
            padding: 15px 0;
            cursor: pointer;
            color: var(--text-muted);
            transition: 0.2s;
            display: flex;
            align-items: center;
            gap: 15px;
            white-space: nowrap;
        }
        .nav-item i { font-size: 1.2rem; min-width: 40px; text-align: center; }
        .nav-item span { display: none; font-weight: 500; }
        .sidebar:hover .nav-item span { display: inline; }
        .nav-item:hover, .nav-item.active { color: var(--text-main); background: rgba(255,255,255,0.05); border-left: 3px solid var(--primary); }

        /* --- MAIN CONTENT AREA --- */
        .main-view { flex: 1; display: flex; flex-direction: column; position: relative; }
        
        .top-bar {
            height: 60px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 30px;
            background: rgba(9, 9, 11, 0.8);
            backdrop-filter: blur(10px);
        }
        .status-badge { 
            background: rgba(16, 185, 129, 0.1); color: var(--success); 
            padding: 5px 12px; border-radius: 20px; font-size: 0.75rem; font-weight: 700; letter-spacing: 1px;
            display: flex; align-items: center; gap: 5px;
        }
        .status-dot { width: 8px; height: 8px; background: var(--success); border-radius: 50%; animation: pulse 2s infinite; }

        /* --- TABS SYSTEM --- */
        .tab-content { display: none; height: calc(100vh - 60px); overflow-y: auto; padding: 30px; }
        .tab-content.active-tab { display: block; animation: fadeIn 0.3s ease; }

        /* --- GENERATOR TAB --- */
        .workspace { display: grid; grid-template-columns: 350px 1fr; gap: 30px; height: 100%; }
        
        /* Control Panel */
        .controls {
            background: var(--bg-panel);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            padding: 20px;
            height: fit-content;
            box-shadow: var(--shadow);
        }
        
        .input-group { margin-bottom: 20px; }
        .label { display: block; color: var(--text-muted); font-size: 0.8rem; font-weight: 600; margin-bottom: 8px; letter-spacing: 0.5px; text-transform: uppercase; }
        
        textarea {
            width: 100%; height: 120px; background: var(--bg-input); border: 1px solid var(--border);
            color: white; padding: 15px; border-radius: var(--radius-sm); resize: none; font-size: 0.95rem;
            transition: 0.2s;
        }
        textarea:focus { border-color: var(--primary); box-shadow: 0 0 0 2px rgba(99, 102, 241, 0.2); }

        .btn-magic {
            width: 100%; background: linear-gradient(90deg, #8b5cf6, #ec4899); border: none; padding: 8px;
            border-radius: 6px; color: white; font-weight: 600; font-size: 0.8rem; cursor: pointer; margin-top: 5px;
            display: flex; align-items: center; justify-content: center; gap: 5px;
        }

        .settings-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 15px; }
        
        select, input[type="text"], input[type="number"] {
            width: 100%; background: var(--bg-input); border: 1px solid var(--border); color: white;
            padding: 10px; border-radius: var(--radius-sm); font-size: 0.9rem;
        }

        .toggle-group { display: flex; gap: 5px; background: var(--bg-input); padding: 4px; border-radius: 8px; }
        .toggle-btn { flex: 1; background: transparent; border: none; color: var(--text-muted); padding: 8px; cursor: pointer; border-radius: 6px; font-size: 0.8rem; }
        .toggle-btn.active { background: var(--bg-panel); color: white; shadow: 0 2px 5px rgba(0,0,0,0.2); font-weight: 600; }

        .btn-generate {
            width: 100%; padding: 18px; background: var(--primary); color: white; border: none;
            border-radius: var(--radius-md); font-size: 1.1rem; font-weight: 700; cursor: pointer;
            margin-top: 20px; box-shadow: 0 4px 15px rgba(99, 102, 241, 0.4); transition: 0.2s;
            display: flex; align-items: center; justify-content: center; gap: 10px;
        }
        .btn-generate:hover { background: var(--primary-hover); transform: translateY(-2px); }
        .btn-generate:disabled { background: #333; cursor: not-allowed; }

        /* Preview Stage */
        .stage {
            background: #000; border-radius: var(--radius-md); border: 1px dashed var(--border);
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            position: relative; overflow: hidden; min-height: 500px;
        }
        .stage img { max-width: 95%; max-height: 80%; border-radius: 8px; box-shadow: 0 0 50px rgba(0,0,0,0.5); display: none; }
        
        .loading-overlay { 
            display: none; text-align: center; 
        }
        .cyber-loader {
            width: 50px; height: 50px; border: 4px solid #333; border-top: 4px solid var(--primary);
            border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto 15px;
        }

        /* Image Tools Overlay */
        .image-tools {
            position: absolute; bottom: 20px; display: none; gap: 10px; 
            background: rgba(0,0,0,0.7); padding: 10px 20px; border-radius: 50px; backdrop-filter: blur(10px);
        }
        .tool-btn {
            background: transparent; border: none; color: white; font-size: 1.2rem; cursor: pointer; 
            transition: 0.2s; position: relative;
        }
        .tool-btn:hover { color: var(--primary); transform: scale(1.1); }
        .tool-btn[data-tooltip]:hover::after {
            content: attr(data-tooltip); position: absolute; bottom: 130%; left: 50%; transform: translateX(-50%);
            background: #000; padding: 5px 10px; border-radius: 5px; font-size: 0.7rem; white-space: nowrap;
        }

        /* --- GALLERY TAB --- */
        .gallery-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 20px; }
        .gallery-item { 
            position: relative; border-radius: var(--radius-md); overflow: hidden; aspect-ratio: 1; 
            cursor: pointer; border: 1px solid var(--border); transition: 0.2s;
        }
        .gallery-item:hover { transform: translateY(-5px); border-color: var(--primary); }
        .gallery-item img { width: 100%; height: 100%; object-fit: cover; }
        .gallery-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(to top, rgba(0,0,0,0.8), transparent);
            opacity: 0; transition: 0.2s; display: flex; flex-direction: column; justify-content: flex-end; padding: 15px;
        }
        .gallery-item:hover .gallery-overlay { opacity: 1; }

        /* --- TERMINAL (LOGS) --- */
        .terminal {
            position: absolute; bottom: 0; left: 0; width: 100%; height: 150px;
            background: rgba(10, 10, 10, 0.95); border-top: 1px solid var(--primary);
            font-family: 'JetBrains Mono', monospace; font-size: 0.8rem; color: #0f0;
            padding: 15px; overflow-y: auto; transform: translateY(100%); transition: 0.3s; z-index: 100;
        }
        .terminal.open { transform: translateY(0); }
        .log-entry { margin-bottom: 5px; }
        .log-time { color: #555; margin-right: 10px; }

        /* --- NOTIFICATION --- */
        .toast {
            position: fixed; top: 20px; right: 20px; background: var(--bg-panel); border-left: 4px solid var(--primary);
            padding: 15px 25px; border-radius: 8px; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            transform: translateX(150%); transition: 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); z-index: 200;
            display: flex; align-items: center; gap: 15px;
        }
        .toast.show { transform: translateX(0); }

        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }

        /* Mobile Responsive */
        @media (max-width: 900px) {
            .workspace { grid-template-columns: 1fr; overflow-y: auto; display: block; }
            .sidebar { width: 0; padding: 0; overflow: hidden; } /* Hidden on mobile for simplicity */
            .sidebar.mobile-open { width: 200px; padding: 20px 0; }
            .stage { min-height: 300px; margin-top: 30px; }
            .top-bar { padding: 0 15px; }
        }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- SIDEBAR NAVIGATION -->
        <aside class="sidebar">
            <div class="brand">
                <i class="fa-solid fa-atom fa-spin" style="--fa-animation-duration: 10s;"></i>
                <span>AETHER</span>
            </div>
            
            <div class="nav-item active" onclick="switchTab('gen')">
                <i class="fa-solid fa-layer-group"></i> <span>Studio</span>
            </div>
            <div class="nav-item" onclick="switchTab('gallery')">
                <i class="fa-solid fa-images"></i> <span>Gallery</span>
            </div>
            <div class="nav-item" onclick="toggleTerminal()">
                <i class="fa-solid fa-terminal"></i> <span>Logs</span>
            </div>
            <div style="margin-top: auto;" class="nav-item" onclick="window.open('https://github.com')">
                <i class="fa-brands fa-github"></i> <span>GitHub</span>
            </div>
        </aside>

        <!-- MAIN VIEW -->
        <main class="main-view">
            <!-- Top Header -->
            <div class="top-bar">
                <h3 id="pageTitle" style="font-weight: 700;">Studio Workstation</h3>
                <div class="status-badge">
                    <div class="status-dot"></div> SYSTEM ONLINE
                </div>
            </div>

            <!-- TAB 1: GENERATOR (STUDIO) -->
            <div id="tab-gen" class="tab-content active-tab">
                <div class="workspace">
                    
                    <!-- Left: Controls -->
                    <div class="controls">
                        <div class="input-group">
                            <span class="label">Primary Prompt</span>
                            <textarea id="prompt" placeholder="Imagine something epic... (e.g., A cybernetic samurai in a neon Tokyo alleyway)"></textarea>
                            <button class="btn-magic" onclick="enhancePrompt()">
                                <i class="fa-solid fa-wand-magic-sparkles"></i> Auto-Enhance Prompt
                            </button>
                        </div>

                        <div class="input-group">
                            <span class="label">Negative Prompt (What to avoid)</span>
                            <input type="text" id="negative" placeholder="blurry, bad quality, deformed hands, watermark">
                        </div>

                        <div class="settings-grid">
                            <div>
                                <span class="label">Model Engine</span>
                                <select id="model">
                                    <option value="flux">Flux Realism (Pro)</option>
                                    <option value="turbo">SDXL Turbo (Fast)</option>
                                    <option value="midjourney">Midjourney Style</option>
                                </select>
                            </div>
                            <div>
                                <span class="label">Seed (Empty = Random)</span>
                                <input type="number" id="seed" placeholder="e.g. 123456">
                            </div>
                        </div>

                        <div class="input-group">
                            <span class="label">Aspect Ratio</span>
                            <div class="toggle-group">
                                <button class="toggle-btn active" onclick="setRatio(this, '1:1')">1:1</button>
                                <button class="toggle-btn" onclick="setRatio(this, '16:9')">16:9</button>
                                <button class="toggle-btn" onclick="setRatio(this, '9:16')">9:16</button>
                                <button class="toggle-btn" onclick="setRatio(this, '4:3')">4:3</button>
                            </div>
                        </div>

                        <button id="genBtn" class="btn-generate" onclick="generateArt()">
                            <i class="fa-solid fa-bolt"></i> GENERATE
                        </button>
                    </div>

                    <!-- Right: Preview Stage -->
                    <div class="stage" id="stage">
                        <div class="loading-overlay" id="loader">
                            <div class="cyber-loader"></div>
                            <p style="font-family: 'JetBrains Mono'; color: var(--primary);">INITIALIZING NEURAL NET...</p>
                        </div>
                        
                        <img id="resultImage" src="" alt="Result">
                        
                        <div class="image-tools" id="imgTools">
                            <button class="tool-btn" data-tooltip="Download HD" onclick="downloadImage()">
                                <i class="fa-solid fa-download"></i>
                            </button>
                            <button class="tool-btn" data-tooltip="Save to Gallery" onclick="saveToGallery()">
                                <i class="fa-solid fa-heart"></i>
                            </button>
                            <button class="tool-btn" data-tooltip="Upscale (Re-run HD)" onclick="upscaleImage()">
                                <i class="fa-solid fa-expand"></i>
                            </button>
                            <button class="tool-btn" data-tooltip="Copy Seed" onclick="copySeed()">
                                <i class="fa-solid fa-fingerprint"></i>
                            </button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- TAB 2: GALLERY -->
            <div id="tab-gallery" class="tab-content">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                    <h2>Your Creations</h2>
                    <button onclick="clearGallery()" style="background: #ef4444; border: none; padding: 8px 15px; color: white; border-radius: 6px; cursor: pointer;">Clear All</button>
                </div>
                <div class="gallery-grid" id="galleryGrid">
                    <!-- Images inserted via JS -->
                </div>
            </div>

            <!-- TERMINAL PANEL -->
            <div class="terminal" id="terminal">
                <div class="log-entry"><span class="log-time">[SYSTEM]</span> Aether Core v2.0 initialized.</div>
                <div class="log-entry"><span class="log-time">[SYSTEM]</span> Ready for input.</div>
            </div>

        </main>
    </div>

    <!-- TOAST -->
    <div class="toast" id="toast">
        <i class="fa-solid fa-check"></i>
        <span id="toastMsg">Action complete</span>
    </div>

    <script>
        // --- GLOBAL STATE ---
        const state = {
            width: 1024,
            height: 1024,
            lastSeed: 0,
            lastPrompt: "",
            history: JSON.parse(localStorage.getItem('aether_gallery')) || []
        };

        // --- UI FUNCTIONS ---
        
        function switchTab(tabName) {
            // Hide all tabs
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active-tab'));
            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
            
            // Show selected
            document.getElementById(`tab-${tabName}`).classList.add('active-tab');
            
            // Highlight nav
            const navIndex = tabName === 'gen' ? 0 : 1;
            document.querySelectorAll('.nav-item')[navIndex].classList.add('active');

            // Page Title
            document.getElementById('pageTitle').innerText = tabName === 'gen' ? 'Studio Workstation' : 'Gallery Archives';

            if(tabName === 'gallery') renderGallery();
        }

        function setRatio(btn, ratio) {
            document.querySelectorAll('.toggle-btn').forEach(el => el.classList.remove('active'));
            btn.classList.add('active');
            
            switch(ratio) {
                case '1:1': state.width = 1024; state.height = 1024; break;
                case '16:9': state.width = 1280; state.height = 720; break;
                case '9:16': state.width = 720; state.height = 1280; break;
                case '4:3': state.width = 1024; state.height = 768; break;
            }
            log(`Aspect ratio set to ${ratio} (${state.width}x${state.height})`);
        }

        function toggleTerminal() {
            document.getElementById('terminal').classList.toggle('open');
        }

        function log(msg) {
            const term = document.getElementById('terminal');
            const time = new Date().toLocaleTimeString();
            const div = document.createElement('div');
            div.className = 'log-entry';
            div.innerHTML = `<span class="log-time">[${time}]</span> ${msg}`;
            term.appendChild(div);
            term.scrollTop = term.scrollHeight; // Auto scroll
        }

        function showToast(msg, type='info') {
            const toast = document.getElementById('toast');
            document.getElementById('toastMsg').innerText = msg;
            toast.style.borderLeftColor = type === 'error' ? '#ef4444' : '#6366f1';
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 3000);
        }

        // --- CORE LOGIC ---

        function enhancePrompt() {
            const input = document.getElementById('prompt');
            const prompt = input.value.trim();
            if(!prompt) return showToast("Write something first!", "error");

            const enhancements = [
                "hyper-realistic", "8k resolution", "cinematic lighting", 
                "unreal engine 5 render", "highly detailed texture", 
                "volumetric fog", "sharp focus", "masterpiece"
            ];
            
            input.value = `${prompt}, ${enhancements.join(', ')}`;
            log("Prompt enhanced with professional keywords.");
            showToast("Prompt Enhanced!");
        }

        function generateArt(isUpscale = false) {
            const promptInput = document.getElementById('prompt').value.trim();
            const negative = document.getElementById('negative').value.trim();
            const model = document.getElementById('model').value;
            const seedInput = document.getElementById('seed').value;

            if(!promptInput) {
                showToast("Please enter a prompt", "error");
                return;
            }

            // UI State
            const btn = document.getElementById('genBtn');
            const loader = document.getElementById('loader');
            const resultImg = document.getElementById('resultImage');
            const tools = document.getElementById('imgTools');

            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> PROCESSING...';
            loader.style.display = 'block';
            resultImg.style.display = 'none';
            tools.style.display = 'none';

            // Logic
            state.lastPrompt = promptInput;
            const seed = seedInput ? parseInt(seedInput) : Math.floor(Math.random() * 1000000);
            state.lastSeed = seed;

            log(`Starting generation. Seed: ${seed}, Model: ${model}`);

            let finalPrompt = promptInput;
            if(negative) finalPrompt += ` --no ${negative}`;

            // Upscale logic (Force higher res if upscale clicked)
            let w = state.width;
            let h = state.height;
            if(isUpscale) {
                w = Math.min(w * 2, 2048); // Cap at 2048 to prevent crashes
                h = Math.min(h * 2, 2048);
                log(`Upscaling to ${w}x${h}...`);
            }

            const encodedPrompt = encodeURIComponent(finalPrompt);
            const url = `https://image.pollinations.ai/prompt/${encodedPrompt}?width=${w}&height=${h}&seed=${seed}&model=${model}&nologo=true`;

            // Loading Image
            const imgObj = new Image();
            imgObj.src = url;

            imgObj.onload = () => {
                resultImg.src = url;
                resultImg.style.display = 'block';
                loader.style.display = 'none';
                tools.style.display = 'flex';
                btn.disabled = false;
                btn.innerHTML = '<i class="fa-solid fa-bolt"></i> GENERATE';
                
                log("Generation complete. Image rendered.");
                showToast("Image Generated Successfully!");
                
                // Auto-save temporary record
                state.currentImage = url;
            };

            imgObj.onerror = () => {
                log("Error: Server timed out or rejected request.");
                showToast("Generation Failed. Try again.", "error");
                loader.style.display = 'none';
                btn.disabled = false;
                btn.innerHTML = 'TRY AGAIN';
            };
        }

        function upscaleImage() {
            log("Initiating Upscale protocol...");
            generateArt(true);
        }

        // --- GALLERY SYSTEM ---

        function saveToGallery() {
            if(!state.currentImage) return;

            // Check if already saved
            const exists = state.history.some(item => item.url === state.currentImage);
            if(exists) {
                showToast("Already in Gallery");
                return;
            }

            const newItem = {
                url: state.currentImage,
                prompt: state.lastPrompt,
                date: new Date().toLocaleDateString(),
                seed: state.lastSeed
            };

            state.history.unshift(newItem);
            if(state.history.length > 50) state.history.pop(); // Max 50 items

            localStorage.setItem('aether_gallery', JSON.stringify(state.history));
            showToast("Saved to Gallery");
            log("Image archived to local database.");
        }

        function renderGallery() {
            const grid = document.getElementById('galleryGrid');
            grid.innerHTML = "";

            if(state.history.length === 0) {
                grid.innerHTML = "<p style='color:#555; width:100%;'>Gallery is empty.</p>";
                return;
            }

            state.history.forEach((item, index) => {
                const div = document.createElement('div');
                div.className = 'gallery-item';
                div.innerHTML = `
                    <img src="${item.url}" loading="lazy">
                    <div class="gallery-overlay">
                        <p style="font-size:0.8rem; margin-bottom:5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">${item.prompt}</p>
                        <div style="display:flex; gap:5px;">
                            <button onclick="loadFromGallery('${item.url}')" style="background:#fff; border:none; border-radius:4px; padding:5px; cursor:pointer;"><i class="fa-solid fa-eye"></i></button>
                            <button onclick="deleteGalleryItem(${index})" style="background:#ef4444; color:white; border:none; border-radius:4px; padding:5px; cursor:pointer;"><i class="fa-solid fa-trash"></i></button>
                        </div>
                    </div>
                `;
                grid.appendChild(div);
            });
        }

        function loadFromGallery(url) {
            switchTab('gen');
            const resultImg = document.getElementById('resultImage');
            resultImg.src = url;
            resultImg.style.display = 'block';
            document.getElementById('loader').style.display = 'none';
            document.getElementById('imgTools').style.display = 'flex';
            state.currentImage = url;
        }

        function deleteGalleryItem(index) {
            state.history.splice(index, 1);
            localStorage.setItem('aether_gallery', JSON.stringify(state.history));
            renderGallery();
            showToast("Image Deleted");
        }

        function clearGallery() {
            if(confirm("Delete all images?")) {
                state.history = [];
                localStorage.removeItem('aether_gallery');
                renderGallery();
                showToast("Gallery Cleared");
            }
        }

        // --- UTILS ---

        async function downloadImage() {
            if(!state.currentImage) return;
            try {
                const response = await fetch(state.currentImage);
                const blob = await response.blob();
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `aether-${state.lastSeed}.png`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                showToast("Download Started");
            } catch(e) {
                showToast("Download failed. Right click image to save.", "error");
            }
        }

        function copySeed() {
            navigator.clipboard.writeText(state.lastSeed);
            showToast(`Seed ${state.lastSeed} copied!`);
        }

        // Init
        log("System boot successful.");

    </script>
</body>
</html>
