<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flash AI (50x Speed)</title>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
    <style>
        /* CSS: Electric High-Speed Theme */
        :root {
            --flash: #ffe600; /* Yellow for electricity */
            --bg: #050505;
            --panel: #1a1a1a;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Rajdhani', sans-serif; }

        body {
            background-color: var(--bg);
            color: white;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* Speed Lines Animation Background */
        body::before {
            content: "";
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: repeating-linear-gradient(transparent, transparent 49px, rgba(255, 230, 0, 0.05) 50px);
            z-index: -1;
        }

        .container {
            width: 90%;
            max-width: 450px;
            background: var(--panel);
            border: 2px solid #333;
            border-radius: 10px;
            padding: 25px;
            text-align: center;
            box-shadow: 0 0 30px rgba(255, 230, 0, 0.1);
            position: relative;
        }

        h1 {
            font-size: 2.5rem;
            text-transform: uppercase;
            font-weight: 800;
            color: var(--flash);
            text-shadow: 0 0 15px var(--flash);
            margin-bottom: 5px;
            font-style: italic;
        }

        .badge {
            background: #333;
            color: var(--flash);
            padding: 3px 10px;
            font-size: 0.8rem;
            border-radius: 4px;
            text-transform: uppercase;
            letter-spacing: 2px;
            border: 1px solid var(--flash);
        }

        textarea {
            width: 100%;
            height: 80px;
            background: #000;
            border: 1px solid #444;
            color: #fff;
            padding: 15px;
            margin-top: 20px;
            font-size: 1.1rem;
            border-radius: 5px;
            outline: none;
            resize: none;
        }

        textarea:focus { border-color: var(--flash); }

        .btn-flash {
            width: 100%;
            background: var(--flash);
            color: black;
            border: none;
            padding: 15px;
            font-size: 1.2rem;
            font-weight: 800;
            text-transform: uppercase;
            margin-top: 15px;
            cursor: pointer;
            clip-path: polygon(10% 0, 100% 0, 100% 80%, 90% 100%, 0 100%, 0 20%);
            transition: 0.1s;
        }

        .btn-flash:active { transform: scale(0.98); }
        .btn-flash:hover { box-shadow: 0 0 20px var(--flash); }

        .image-area {
            margin-top: 20px;
            min-height: 250px;
            background: #000;
            border: 1px dashed #444;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        .image-area img {
            width: 100%;
            height: auto;
            display: none;
            border: 1px solid var(--flash);
        }

        /* Super Fast Loader */
        .loader {
            display: none;
            width: 100%;
            height: 4px;
            background: #222;
            position: relative;
            overflow: hidden;
        }
        .loader::after {
            content: '';
            position: absolute;
            left: 0; top: 0; height: 100%; width: 50%;
            background: var(--flash);
            animation: zip 0.5s infinite linear;
        }

        @keyframes zip { 0% { left: -50%; } 100% { left: 100%; } }

    </style>
</head>
<body>

    <div class="container">
        <h1>Flash Gen ⚡</h1>
        <span class="badge">Turbo Mode Enabled</span>

        <textarea id="prompt" placeholder="Type prompt... (Ex: Sports car drifting)"></textarea>

        <button class="btn-flash" id="genBtn" onclick="generateFast()">Create (Fast)</button>

        <div class="image-area">
            <div class="loader" id="loader"></div>
            <img id="resultImage" src="" onclick="downloadImage()">
        </div>
        <p style="font-size: 0.7rem; color: #666; margin-top: 10px;">Click image to download</p>
    </div>

    <script>
        // FLASH MODE LOGIC
        
        function generateFast() {
            const prompt = document.getElementById('prompt').value;
            const img = document.getElementById('resultImage');
            const loader = document.getElementById('loader');
            const btn = document.getElementById('genBtn');

            if(!prompt) return alert("Prompt likho bhai!");

            // UI Speed Setup
            btn.disabled = true;
            btn.innerText = "⚡ WORKING...";
            img.style.display = "none";
            loader.style.display = "block";

            // --- THE 50X SPEED TRICK ---
            // 1. Model = Turbo (Ye 1 second me banata hai)
            // 2. Size = 512x512 (Standard fast size)
            // 3. Random seed to ensure new image every time
            
            const seed = Math.floor(Math.random() * 10000);
            // URL clean encoding for speed
            const safePrompt = encodeURIComponent(prompt);
            
            // Pollinations ka Turbo Endpoint
            const url = `https://image.pollinations.ai/prompt/${safePrompt}?model=turbo&width=512&height=512&seed=${seed}&nologo=true`;

            // Image Pre-fetch
            const newImg = new Image();
            newImg.src = url;

            newImg.onload = () => {
                img.src = url;
                loader.style.display = "none";
                img.style.display = "block";
                btn.disabled = false;
                btn.innerText = "Create (Fast)";
            };

            newImg.onerror = () => {
                alert("Network thoda slow hai, dobara click karo!");
                loader.style.display = "none";
                btn.disabled = false;
                btn.innerText = "Try Again";
            };
        }

        function downloadImage() {
            const img = document.getElementById('resultImage');
            if(img.src) {
                const a = document.createElement('a');
                a.href = img.src;
                a.download = `flash-img-${Date.now()}.jpg`;
                a.click();
            }
        }
    </script>

</body>
</html>
